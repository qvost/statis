  <line x1="24" y1="268" x2="768" y2="268" class="axis" stroke-width="1.6" />
  <text x="24" y="290" text-anchor="start" class="note">Shading = documented or implemented support; ? = unverified; — = not applicable.</text>
  <text x="24" y="312" text-anchor="start" class="small muted">Speed and size depend on workload. Sources and runtime limits: docs/benchmarking.md.</text>
</svg>