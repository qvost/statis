  <text x="495" y="187" text-anchor="middle" class="">?</text>
  <text x="604" y="187" text-anchor="middle" class="">?</text>
  <text x="713" y="187" text-anchor="middle" class="">?</text>
  <text x="24" y="219" text-anchor="start" class="">Hardware RDTSC Trap &amp; Emulate</text>
  <text x="386" y="219" text-anchor="middle" class="">No</text>
  <rect x="446" y="200" width="98" height="27" fill="#f0cfcb" />
  <text x="495" y="219" text-anchor="middle" class="">Yes</text>
  <rect x="555" y="200" width="98" height="27" fill="#f0cfcb" />
  <text x="604" y="219" text-anchor="middle" class="">Yes</text>
  <rect x="664" y="200" width="98" height="27" fill="#f0cfcb" />
  <text x="713" y="219" text-anchor="middle" class="">Yes</text>
